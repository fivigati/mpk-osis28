        function handleMpkSubmit(e) {
            e.preventDefault();
            const selectIndex = document.getElementById('mpk-select').value;
            const code = document.getElementById('mpk-code').value.trim();
            const errorEl = document.getElementById('mpk-error');

            if (selectIndex === "") {
                errorEl.textContent = 'Silakan pilih nama peserta terlebih dahulu.';
                errorEl.classList.remove('hidden');
                return;
            }

            if (code !== 'MPK28') {
                errorEl.textContent = 'Kode verifikasi salah! Silakan periksa kembali kode yang dimasukkan.';
                errorEl.classList.remove('hidden');
                return;
            }

            const sortedMpk = [...mpkData].sort((a, b) => a.nama.localeCompare(b.nama));
            const selectedCandidate = sortedMpk[Number(selectIndex)];
            router.navigate('mpk_result', { candidate: selectedCandidate });
        }

                        </div>

                        ${isLolos ? `
                            <div class="bg-emerald-50/50 border border-emerald-200/70 border-l-4 border-l-emerald-500 p-6 rounded-2xl shadow-sm mb-8 space-y-4 font-quicksand text-slate-700 text-sm sm:text-base text-justify">
                                <h3 class="font-poppins font-bold text-xl sm:text-2xl text-emerald-800 text-center mb-2">Selamat, ${candidate.nama}! 🎉</h3>
                                <p class="leading-relaxed text-center">Kamu dinyatakan <b class="text-emerald-700 font-extrabold">LOLOS</b> dalam seleksi <b>Majelis Perwakilan Kelas (MPK) SMP Negeri 28 Malang</b>.</p>
                                <p class="leading-relaxed text-center">Selamat atas pencapaian ini. Semoga kepercayaan yang diberikan menjadi awal untuk belajar bertanggung jawab, menyampaikan aspirasi, bekerja sama, dan memberikan kontribusi positif bagi sekolah.</p>
                            </div>
                        ` : `
                            <div class="bg-rose-50/40 border border-rose-200/60 border-l-4 border-l-rose-500 p-6 rounded-2xl shadow-sm mb-8 space-y-4 font-quicksand text-slate-700 text-sm sm:text-base text-justify">
                                <h3 class="font-poppins font-bold text-xl sm:text-2xl text-rose-800 text-center mb-2">Terima kasih, ${candidate.nama}.</h3>
                                <p class="leading-relaxed text-center">Terima kasih atas antusiasme, keberanian, dan kesungguhanmu dalam mengikuti proses seleksi <b>MPK SMP Negeri 28 Malang</b>.</p>
                                <p class="leading-relaxed text-center">Hasil seleksi kali ini memang belum sesuai dengan harapan, namun satu hasil tidak menentukan seluruh perjalananmu. Pengalaman ini tetap menjadi bagian berharga untuk belajar, berkembang, dan mengenal potensi diri.</p>
                                <p class="leading-relaxed font-semibold text-slate-700 text-center">Tetap semangat, terus aktif, dan jangan berhenti mengambil kesempatan untuk berkarya serta memberikan kontribusi terbaik bagi sekolah. 🌱</p>
                            </div>
                        `}

                        <div class="flex flex-col sm:flex-row gap-3">
                            <button onclick="router.navigate('mpk_verify')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-4 rounded-2xl transition-all text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-95 shadow-sm font-poppins">
                                <i class="fa-solid fa-rotate-left"></i> Cek Nama Lain
                            </button>
                            <button onclick="router.navigate('home')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-2xl transition-all shadow-lg shadow-emerald-600/25 text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-95 font-poppins">
                                <i class="fa-solid fa-house"></i> Beranda Utama
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOsisCheckView() {
            const sortedOsis = [...osisData].sort((a, b) => a.nama.localeCompare(b.nama));
            let optionsHtml = '<option value="" disabled selected>-- Pilih Nama Lengkap Anda --</option>';
            sortedOsis.forEach((item, index) => {
                optionsHtml += `<option value="${index}">${item.nama} (Kelas ${item.kelas})</option>`;
            });

            return `
                <div class="animate-fade-in max-w-md mx-auto">
                    <div class="glass-card p-8 sm:p-10 rounded-3xl shadow-2xl shadow-slate-200/60 border border-white">
                        <div class="text-center mb-8">
                            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                                <i class="fa-solid fa-id-card"></i>
                            </div>
                            <h3 class="font-poppins text-2xl font-bold text-slate-900">Cek Hasil Seleksi OSIS</h3>
                            <p class="text-xs sm:text-sm text-slate-500 mt-2 font-quicksand">
                                Pengumuman hasil <b>Tes dan Wawancara Seleksi OSIS</b>.
                            </p>
                            <div class="mt-5 bg-blue-50 border border-blue-200 text-blue-800 rounded-2xl p-4 text-left text-xs sm:text-sm font-quicksand leading-relaxed">
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-circle-info mt-0.5 text-blue-600"></i>
                                    <p>
                                        <b>Khusus peserta yang mengikuti kedua tahap seleksi.</b><br>
                                        Silakan pilih nama peserta pada daftar untuk melihat hasil seleksi.
                                    </p>
                                </div>
                            </div>
                        </div>

                        <form onsubmit="handleOsisSubmit(event)" class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2 font-poppins">Nama Peserta</label>
                                <p class="text-[11px] text-slate-500 mb-2 font-quicksand">
                                    Daftar nama di bawah ini khusus peserta yang mengikuti <b>Tes + Wawancara</b>.
                                </p>
                                <select id="osis-select" required
                                    class="w-full px-4 py-4 rounded-2xl bg-slate-50/80 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-slate-800 text-sm font-medium transition-all shadow-inner font-quicksand">
                                    ${optionsHtml}
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2 font-poppins">Kode Verifikasi</label>
                                <input type="password" id="osis-code" placeholder="Masukkan kode verifikasi..." required
                                    class="w-full px-4 py-4 rounded-2xl bg-slate-50/80 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-slate-800 text-sm font-medium transition-all shadow-inner font-quicksand">
                                <p id="osis-error" class="text-red-500 text-xs mt-2 hidden font-medium text-center font-quicksand"></p>
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold py-4 rounded-2xl transition-all shadow-lg shadow-blue-600/25 text-sm flex items-center justify-center gap-2 font-poppins">
                                <i class="fa-solid fa-magnifying-glass"></i> Lihat Hasil Seleksi
                            </button>

                            <button type="button" onclick="router.navigate('home')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3.5 rounded-2xl transition-all text-xs font-poppins">
                                Kembali ke Beranda
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleOsisSubmit(e) {
            e.preventDefault();
            const selectIndex = document.getElementById('osis-select').value;
            const code = document.getElementById('osis-code').value.trim();
            const errorEl = document.getElementById('osis-error');

            if (code !== 'OSIS28') {
                errorEl.textContent = 'Kode verifikasi salah! Silakan coba lagi.';
                errorEl.classList.remove('hidden');
                return;
            }

            if (selectIndex === "") {
                errorEl.textContent = 'Silakan pilih nama peserta terlebih dahulu.';
                errorEl.classList.remove('hidden');
                return;
            }

            const sortedOsis = [...osisData].sort((a, b) => a.nama.localeCompare(b.nama));
            const selectedCandidate = sortedOsis[selectIndex];

            router.navigate('osis_result', { candidate: selectedCandidate });
        }

        function renderOsisResultView(params) {
            const candidate = params.candidate;
            if (!candidate) {
                router.navigate('osis_check');
                return '';
            }

            const isLolos = candidate.status === 'LOLOS';

            return `
                <div class="animate-fade-in max-w-lg mx-auto">
                    <div class="glass-card p-6 sm:p-10 rounded-3xl shadow-2xl shadow-slate-200/60 border border-white">
                        
                        <div class="text-center mb-6">
                            <div class="inline-flex items-center gap-2 ${isLolos ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-200'} text-xs font-bold px-4 py-2 rounded-full shadow-sm font-poppins">
                                <i class="fa-solid ${isLolos ? 'fa-circle-check text-emerald-600' : 'fa-circle-exclamation text-rose-600'} text-sm"></i> 
                                ${isLolos ? 'SELAMAT, DINYATAKAN LOLOS' : 'HASIL SELEKSI OSIS'}
                            </div>
                        </div>

                        <!-- Biodata box -->
                        <div class="bg-white/95 border border-slate-100 p-5 sm:p-6 rounded-2xl mb-8 text-left shadow-sm">
                            <div class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1 font-poppins">Nama Peserta</div>
                            <div class="font-poppins text-lg sm:text-xl font-extrabold text-slate-900 mb-4">${candidate.nama}</div>
                            <div class="flex items-center gap-3 text-xs font-semibold font-poppins">
                                <span class="bg-blue-50 text-blue-700 px-3.5 py-1.5 rounded-xl border border-blue-200/70">Kelas: <b class="text-blue-900">${candidate.kelas}</b></span>
                                <span class="px-3.5 py-1.5 rounded-xl border ${isLolos ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200 shadow-sm'}">Status: <b class="${isLolos ? 'text-emerald-700 font-extrabold' : 'text-rose-700 font-extrabold tracking-wide'}">${candidate.status}</b></span>
                            </div>
                        </div>

                        <!-- Result text block with single cohesive card and left border accent -->
                        ${isLolos ? `
                            <div class="bg-emerald-50/40 border border-emerald-200/60 border-l-4 border-l-emerald-500 p-6 rounded-2xl shadow-sm mb-8 space-y-4 font-quicksand text-slate-700 text-sm sm:text-base text-justify">
                                <h3 class="font-poppins font-bold text-xl sm:text-2xl text-emerald-800 text-left mb-2">Selamat, kamu terpilih! 🎉</h3>
                                <p class="leading-relaxed">Kamu telah mengikuti <b>Tes dan Wawancara Seleksi OSIS</b> dan dinyatakan <b class="text-emerald-700 font-extrabold">LOLOS</b> sebagai calon pengurus OSIS Masa Bakti 2026/2027.</p>
                                <p class="leading-relaxed">Perjalanan baru saja dimulai.</p>
                                <p class="leading-relaxed text-emerald-900 font-medium">Mari belajar memimpin, berkolaborasi, berani menyampaikan ide, dan bersama-sama membuat SMP Negeri 28 Malang menjadi tempat yang semakin seru untuk tumbuh dan berkarya.</p>
                            </div>
                        ` : `
                            <div class="bg-amber-50/40 border border-amber-200/50 border-l-4 border-l-amber-600 p-6 rounded-2xl shadow-sm mb-8 space-y-4 font-quicksand text-slate-700 text-sm sm:text-base text-justify">
                                <h3 class="font-poppins font-bold text-base sm:text-lg text-slate-800 text-left mb-2" style="color: #64748b;">Terima kasih sudah berani mencoba.</h3>
                                <p class="leading-relaxed">Kamu sudah melangkah lebih jauh dengan mengikuti proses seleksi ini, dan itu adalah sesuatu yang patut diapresiasi.</p>
                                <p class="leading-relaxed">Kali ini hasilnya belum sesuai harapan. Tetapi jangan berhenti di sini. Satu hasil seleksi tidak menentukan seberapa besar potensimu.</p>
                                <p class="leading-relaxed font-semibold" style="color: #475569;">Tetap aktif, terus berkembang, dan jangan berhenti mencari kesempatan untuk memberikan kontribusi terbaik bagi sekolah. 🌱</p>
                            </div>
                        `}

                        <!-- Action buttons -->
                        <div class="flex flex-col sm:flex-row gap-3">
                            <button onclick="router.navigate('osis_check')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-4 rounded-2xl transition-all text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-95 shadow-sm font-poppins">
                                <i class="fa-solid fa-rotate-left"></i> Cek Nama Lain
                            </button>
                            <button onclick="router.navigate('home')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-2xl transition-all shadow-lg shadow-blue-600/25 text-xs sm:text-sm flex items-center justify-center gap-2 active:scale-95 font-poppins">
                                <i class="fa-solid fa-house"></i> Beranda Utama
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize App as soon as the DOM is ready
        function initApp() {
            try {
                router.render();
            } catch (err) {
                console.error('Gagal merender aplikasi:', err);
                const container = document.getElementById('app-container');
                if (container) {
                    container.innerHTML = `
                        <div class="glass-card max-w-2xl mx-auto p-8 rounded-3xl text-center shadow-xl">
                            <h2 class="font-poppins text-2xl font-bold text-slate-900 mb-3">Portal Pengumuman Seleksi</h2>
                            <p class="font-quicksand text-slate-600">Silakan muat ulang halaman untuk mencoba kembali.</p>
                        </div>`;
                }
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
