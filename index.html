                if (item.jabatan === 'Ketua') badgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
                else if (item.jabatan === 'Wakil') badgeColor = 'bg-teal-100 text-teal-800 border-teal-200';
                else if (item.jabatan === 'Sekretaris' || item.jabatan === 'Bendahara') badgeColor = 'bg-blue-100 text-blue-800 border-blue-200';

                listHtml += `
                    <div class="flex items-center justify-between p-4 sm:p-5 rounded-2xl bg-white/90 hover:bg-white border border-slate-100 shadow-sm hover:shadow-md transition-all">
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm flex items-center justify-center shadow-inner">
                                ${item.no}
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-900 text-sm sm:text-base uppercase tracking-tight">${item.nama}</h4>
                                <span class="inline-block mt-1 text-xs font-semibold px-3 py-0.5 rounded-full border ${badgeColor}">${item.jabatan}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
                <div class="animate-fade-in max-w-2xl mx-auto space-y-6">
                    <div class="glass-card p-8 sm:p-10 rounded-3xl shadow-xl shadow-slate-200/60 border border-white text-center">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl shadow-lg">
                            <i class="fa-solid fa-award"></i>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-4">Pengumuman Resmi MPK</h2>
                        <div class="space-y-4 text-slate-600 text-sm sm:text-base leading-relaxed text-left sm:text-center font-normal">
                            <p>Terimakasih kepada seluruh peserta yang telah berpartisipasi dengan penuh semangat.</p>
                            <p>Berikut adalah daftar nama MPK SMP Negeri 28 Malang, masa bakti 2026 - 2027:</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        ${listHtml}
                    </div>

                    <div class="pt-6 text-center">
                        <button onclick="router.navigate('home')" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold py-4 px-8 rounded-2xl transition-all shadow-xl shadow-slate-900/10 text-sm inline-flex items-center gap-2 active:scale-95">
                            <i class="fa-solid fa-arrow-left"></i> Kembali ke Menu Utama
                        </button>
                    </div>
                </div>
            `;
        }

        function renderOsisCheckView() {
            const sortedOsis = [...osisData].sort((a, b) => a.nama.localeCompare(b.nama));
            let optionsHtml = '<option value="" disabled selected>-- Pilih Nama Lengkap Anda --</option>';
            sortedOsis.forEach((item, index) => {
                optionsHtml += `<option value="${index}">${item.nama} (Kelas ${item.kelas})</option>`;
            });

            return `
                <div class="animate-fade-in max-w-md mx-auto">
                    <div class="glass-card p-8 sm:p-10 rounded-3xl shadow-2xl shadow-slate-200/60 border border-white">
                        <div class="text-center mb-8">
                            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                                <i class="fa-solid fa-id-card"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-900">Cek Hasil Seleksi OSIS</h3>
                            <p class="text-xs sm:text-sm text-slate-500 mt-2">Pilih nama kamu dan masukkan kode verifikasi resmi untuk melihat hasil.</p>
                        </div>

                        <form onsubmit="handleOsisSubmit(event)" class="space-y-5">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Nama Peserta</label>
                                <select id="osis-select" required
                                    class="w-full px-4 py-4 rounded-2xl bg-slate-50/80 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-slate-800 text-sm font-medium transition-all shadow-inner">
                                    ${optionsHtml}
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Kode Verifikasi</label>
                                <input type="password" id="osis-code" placeholder="Masukkan kode verifikasi..." required
                                    class="w-full px-4 py-4 rounded-2xl bg-slate-50/80 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-slate-800 text-sm font-medium transition-all shadow-inner">
                                <p id="osis-error" class="text-red-500 text-xs mt-2 hidden font-medium text-center"></p>
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold py-4 rounded-2xl transition-all shadow-lg shadow-blue-600/25 text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-magnifying-glass"></i> Lihat Hasil Seleksi
                            </button>

                            <button type="button" onclick="router.navigate('home')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3.5 rounded-2xl transition-all text-xs">
                                Kembali ke Beranda
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleOsisSubmit(e) {
            e.preventDefault();
            const selectIndex = document.getElementById('osis-select').value;
            const code = document.getElementById('osis-code').value.trim();
            const errorEl = document.getElementById('osis-error');

            if (code !== 'OSIS28') {
                errorEl.textContent = 'Kode verifikasi salah! Silakan coba lagi.';
                errorEl.classList.remove('hidden');
                return;
            }

            if (selectIndex === "") {
                errorEl.textContent = 'Silakan pilih nama peserta terlebih dahulu.';
                errorEl.classList.remove('hidden');
                return;
            }

            const sortedOsis = [...osisData].sort((a, b) => a.nama.localeCompare(b.nama));
            const selectedCandidate = sortedOsis[selectIndex];

            router.navigate('osis_result', { candidate: selectedCandidate });
        }

        function renderOsisResultView(params) {
            const candidate = params.candidate;
            if (!candidate) {
                router.navigate('osis_check');
                return '';
            }

            const isLolos = candidate.status === 'LOLOS';

            return `
                <div class="animate-fade-in max-w-lg mx-auto">
                    <div class="glass-card p-8 sm:p-12 rounded-3xl shadow-2xl shadow-slate-200/60 border border-white text-center">
                        
                        <!-- Header badge -->
                        <div class="inline-flex items-center gap-2 ${isLolos ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-200'} text-xs font-bold px-4 py-2 rounded-full mb-6 shadow-sm">
                            <i class="fa-solid ${isLolos ? 'fa-circle-check text-emerald-600' : 'fa-circle-exclamation text-rose-600'} text-sm"></i> 
                            ${isLolos ? 'SELAMAT, DINYATAKAN LOLOS' : 'HASIL SELEKSI OSIS'}
                        </div>

                        <!-- Biodata box with rich blue accents -->
                        <div class="bg-white/95 border border-slate-100 p-6 rounded-2xl mb-8 text-left shadow-md">
                            <div class="text-xs font-bold text-blue-600 uppercase tracking-wider mb-1">Nama Peserta</div>
                            <div class="text-lg sm:text-xl font-extrabold text-slate-900 mb-4">${candidate.nama}</div>
                            <div class="flex items-center gap-3 text-xs font-semibold">
                                <span class="bg-blue-50 text-blue-700 px-3.5 py-1.5 rounded-xl border border-blue-200/60">Kelas: <b class="text-blue-900">${candidate.kelas}</b></span>
                                <span class="px-3.5 py-1.5 rounded-xl border ${isLolos ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'}">Status: <b class="${isLolos ? 'text-emerald-700 font-extrabold' : 'text-rose-700 font-extrabold'}">${candidate.status}</b></span>
                            </div>
                        </div>

                        <!-- Announcement text based on status -->
                        ${isLolos ? `
                            <div class="space-y-4 text-left text-slate-700 text-sm sm:text-base leading-relaxed mb-8">
                                <h3 class="font-extrabold text-2xl text-emerald-700 text-center mb-2">Selamat, kamu terpilih! 🎉</h3>
                                <p class="font-medium text-center text-slate-800">Kamu berhasil melewati rangkaian seleksi OSIS dan dinyatakan <b class="text-emerald-700">LOLOS</b> sebagai calon pengurus OSIS Masa Bakti 2026/2027.</p>
                                <p class="text-center text-slate-600">Perjalanan baru saja dimulai.</p>
                                <div class="bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200 p-5 rounded-2xl text-xs sm:text-sm text-emerald-900 font-medium text-center mt-4 shadow-sm">
                                    Mari belajar memimpin, berkolaborasi, berani menyampaikan ide, dan bersama-sama membuat SMP Negeri 28 Malang menjadi tempat yang semakin seru untuk tumbuh dan berkarya.
                                </div>
                            </div>
                        ` : `
                            <div class="space-y-4 text-left text-slate-700 text-sm sm:text-base leading-relaxed mb-8">
                                <h3 class="font-extrabold text-2xl text-slate-900 text-center mb-2">Terima kasih sudah berani mencoba.</h3>
                                <p class="font-medium text-center text-slate-700 text-base sm:text-lg">Kamu sudah melangkah lebih jauh dengan mengikuti proses seleksi ini, dan itu adalah sesuatu yang patut diapresiasi.</p>
                                <p class="text-center text-slate-500 text-xs sm:text-sm font-normal">Kali ini hasilnya belum sesuai harapan. Tetapi jangan berhenti di sini. Satu hasil seleksi tidak menentukan seberapa besar potensimu.</p>
                                <div class="bg-gradient-to-br from-amber-50 via-orange-50/50 to-amber-50 border border-amber-200/75 p-5 rounded-2xl text-xs sm:text-sm text-amber-900 font-medium text-center mt-4 shadow-sm">
                                    Tetap aktif, terus berkembang, dan jangan berhenti mencari kesempatan untuk memberikan kontribusi terbaik bagi sekolah. 🌱
                                </div>
                            </div>
                        `}

                        <!-- Action buttons -->
                        <div class="flex flex-col sm:flex-row gap-3">
                            <button onclick="router.navigate('osis_check')" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-4 rounded-2xl transition-all text-sm flex items-center justify-center gap-2 active:scale-95 shadow-sm">
                                <i class="fa-solid fa-rotate-left"></i> Cek Nama Lain
                            </button>
                            <button onclick="router.navigate('home')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-2xl transition-all shadow-lg shadow-blue-600/25 text-sm flex items-center justify-center gap-2 active:scale-95">
                                <i class="fa-solid fa-house"></i> Beranda Utama
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize App on load
        window.onload = function() {
            router.navigate('home');
        };
    </script>
</body>
</html>
